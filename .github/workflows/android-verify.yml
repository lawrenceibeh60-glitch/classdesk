name: Android source verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-parity-completion
    paths:
      - "android/**"
      - ".github/workflows/android-verify.yml"

permissions:
  contents: read

concurrency:
  group: classdesk-android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android-source:
    name: Compile and test Android source (no APK packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure runner Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools not found at $SDK_ROOT" >&2
            find /usr/local/lib/android/sdk -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Kotlin and run unit tests
        working-directory: android
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
