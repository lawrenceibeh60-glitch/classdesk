name: Windows desktop release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "desktop/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://classdesk:classdesk@127.0.0.1:5432/classdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run desktop:build
      - name: Verify PostgreSQL runtime is unpacked
        shell: pwsh
        run: |
          $app = "dist-desktop/win-unpacked/resources/app"
          $archive = "dist-desktop/win-unpacked/resources/app.asar"
          $postgres = "$app/node_modules/@embedded-postgres/windows-x64/native/bin/postgres.exe"
          $module = "$app/node_modules/@embedded-postgres/windows-x64/dist/index.js"
          if (Test-Path $archive) { throw "ASAR must be disabled for embedded PostgreSQL native binaries." }
          if (!(Test-Path $postgres)) { throw "Embedded PostgreSQL executable is missing from the filesystem app: $postgres" }
          if (!(Test-Path $module)) { throw "Embedded PostgreSQL Windows module is missing from the filesystem app: $module" }
      - uses: actions/upload-artifact@v4
        with:
          name: AFIT-ClassDesk-Setup
          path: dist-desktop/AFIT-ClassDesk-Setup.exe
          if-no-files-found: error
      - name: Install, launch, persist, and uninstall
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1